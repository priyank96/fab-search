<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>fab-search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">fab-search</a>
            <div class="nav-links">
                <a href="/" class="active" data-page="search">Search</a>
                <a href="#catalogs" data-page="catalogs">Catalogs</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Search Page -->
        <section id="page-search" class="page active">
            <div class="upload-area" id="upload-area">
                <input type="file" id="file-input" accept="image/*" hidden>
                <div class="upload-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </div>
                <p class="upload-text">Tap to take a photo or choose an image</p>
                <p class="upload-hint">JPG, PNG, or WebP</p>
            </div>

            <!-- Crop modal -->
            <div id="crop-modal" class="crop-modal hidden">
                <div class="crop-container">
                    <img id="crop-image" alt="Crop preview">
                </div>
                <div class="crop-toolbar">
                    <button id="crop-cancel-btn" class="btn-secondary">Cancel</button>
                    <button id="crop-confirm-btn" class="btn-primary">Confirm Crop</button>
                </div>
            </div>

            <div id="preview-container" class="preview-container hidden">
                <img id="preview-image" alt="Query preview">
                <button id="recrop-btn" class="btn-icon" title="Re-crop" style="right:2.75rem">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2v6h6M18 22v-6h-6"/>
                        <path d="M21 12A9 9 0 0 0 6.636 5.636L2 8m20 8l-4.636 2.364A9 9 0 0 1 3 12"/>
                    </svg>
                </button>
                <button id="clear-btn" class="btn-icon" title="Clear">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="search-controls">
                <label for="top-k">Results: <span id="top-k-value">5</span></label>
                <input type="range" id="top-k" min="1" max="20" value="5">
                <button id="search-btn" class="btn-primary" disabled>Search</button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Searching catalogs...</p>
            </div>

            <div id="results" class="results"></div>

            <!-- Image viewer modal -->
            <div id="viewer-modal" class="viewer-modal hidden">
                <div class="viewer-content">
                    <div id="viewer-body" class="viewer-body">
                        <img id="viewer-image" alt="Result page">
                        <canvas id="viewer-canvas"></canvas>
                    </div>
                </div>
                <button id="viewer-close-btn" class="btn-icon viewer-close" title="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div id="viewer-meta" class="viewer-meta"></div>
            </div>
        </section>

        <!-- Catalogs Page -->
        <section id="page-catalogs" class="page">
            <h2>Indexed Catalogs</h2>
            <div id="catalogs-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading catalogs...</p>
            </div>
            <div id="catalogs-list" class="catalogs-list"></div>
            <p id="catalogs-empty" class="empty-state hidden">No catalogs indexed yet. Use the CLI to add catalogs.</p>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
